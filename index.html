async function unlock(code) {
  const base = await crypto.subtle.importKey(
    "raw", new TextEncoder().encode(code), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: bytes(SALT), iterations: ITER, hash: "SHA-256" },
    base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: bytes(IV) }, key, bytes(DATA));
  return new TextDecoder().decode(plain);
}

  const error = document.getElementById("err");
  const code = (document.getElementById("code").value || "").trim().toLowerCase();
  if (!code) { error.textContent = "Enter the access code."; return; }
  button.disabled = true; button.textContent = "Opening\u2026"; error.textContent = "";
  try {
    const html = await unlock(code);
    try { sessionStorage.setItem("absa_home_code", code); } catch (e) {}
    document.open(); document.write(html); document.close();
  } catch (e) {
    button.disabled = false; button.textContent = "Open the proposal";
    error.textContent = "That code does not match. Check the message we sent you.";
  }
}

document.getElementById("go").addEventListener("click", open_);
document.getElementById("code").addEventListener("keydown", (e) => {
  if (e.key === "Enter") open_();
});
try {
  const saved = sessionStorage.getItem("absa_home_code");
  if (saved) { document.getElementById("code").value = saved; open_(); }
} catch (e) {}
</script>
</body>
</html>
